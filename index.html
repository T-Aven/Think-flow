<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thinkflow by T. Aven</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #fdfcf9;
      color: #222;
      text-align: center;
    }

    header {
      background-color: #edf6f9;
      padding: 40px 20px 20px;
    }

    header img {
      width: 150px;
      height: auto;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin: 10px 0;
      color: #006d77;
    }

    p {
      font-size: 1.1rem;
      color: #555;
      max-width: 600px;
      margin: 10px auto 30px;
    }

    .chart {
      margin: 40px auto;
      max-width: 90%;
    }

    .chart img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 0.9rem;
      background-color: #f1f1f1;
      color: #555;
    }

    a.button {
      display: inline-block;
      margin-top: 10px;
      background-color: #83c5be;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.3s ease;
    }

    a.button:hover {
      background-color: #5ca9a0;
    }

    .instagram {
      margin-top: 15px;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.6rem;
      }
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="assets/logo_ThinkFlow" alt="Thinkflow Logo.png">
    <h1>Unlock Your Focus with Thinkflow</h1>
    <p>Plan your month with intention. Discover the difference between Free, Basic, and Premium planners.</p>
    <a class="button" href="https://aventom.gumroad.com" target="_blank">View Planners on Gumroad</a>

    <div class="instagram">
      <p>Follow us on Instagram:  
        <a href="https://instagram.com/aven.tom" target="_blank">@aven.tom</a>
      </p>
    </div>
  </header>

  <section class="chart">
    <img src="assets/tabela_planerow.png" alt="Comparison of Planner Versions">
  </section>

  <footer>
    © 2025 Thinkflow by T. Aven. All rights reserved.
  </footer>

</body>
</html>
